<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; img-src data:; base-uri 'none'; form-action 'none'">
<title>SwarmScope Evidence Viewer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='14' cy='14' r='9' fill='none' stroke='%2314161b' stroke-width='3'/%3E%3Cpath d='M21 21l7 7' stroke='%2314161b' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M9.5 14.2l3 3 5.5-6.2' fill='none' stroke='%230a6f53' stroke-width='3'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme:light dark;
  --bg:light-dark(#f2efe6,#0d0f13);
  --surface:light-dark(#fbfaf5,#151820);
  --surface2:light-dark(#ebe7db,#1c202a);
  --ink:light-dark(#14161b,#ece9e0);
  --muted:light-dark(#555a68,#a1a6b4);
  --faint:light-dark(#7d818d,#737988);
  --rule:light-dark(#d6d0c0,#2a2f3b);
  --ok:light-dark(#0a6f53,#41dca0);
  --ok-bg:light-dark(#d9eee4,#10322a);
  --bad:light-dark(#b3261a,#ff8270);
  --bad-bg:light-dark(#f5dad4,#3b1b17);
  --warn:light-dark(#8a5500,#f3b845);
  --warn-bg:light-dark(#f4e4bf,#3a2e12);
  --sig:light-dark(#2340c8,#9db0ff);
  --sig-bg:light-dark(#dfe4fb,#1c2444);
  --mark-bg:light-dark(#ffe45c,#7a5c00);
  --mark-ink:light-dark(#14161b,#fff8e0);
  --shadow:light-dark(0 10px 40px rgba(20,22,27,.18),0 10px 40px rgba(0,0,0,.6));
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,"Liberation Mono",Menlo,monospace;
  --drawer:min(520px,100vw);--hh:58px;
}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-width:320px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--sig)}
:focus-visible{outline:2px solid var(--sig);outline-offset:2px;border-radius:2px}
.sr-only{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
[hidden]{display:none!important}
svg{display:block}
.ic{flex:none}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--ink);box-shadow:0 3px 0 -2px var(--bg),0 4px 0 -2px var(--rule)}
.top-in{max-width:1240px;margin:0 auto;padding:8px 20px 0;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;padding-bottom:6px}
.brand-name{font:700 19px/1 var(--serif);letter-spacing:.01em}
.brand-sub{font:600 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-left:1px solid var(--rule);padding-left:10px}
.tabs{display:flex;gap:2px;margin-left:8px;flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;background:none;border:0;padding:10px 13px 11px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;border-radius:0;display:flex;align-items:baseline;gap:6px}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:var(--ink)}
.tab[aria-selected=true]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;background:var(--ink)}
.tab .n{font:500 11px/1 var(--mono);color:var(--faint);font-variant-numeric:tabular-nums}
.tools{display:flex;align-items:center;gap:8px;padding-bottom:6px;margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);background:var(--surface);padding:6px 11px;font-size:13px;font-weight:600;border-radius:3px;color:var(--ink);line-height:1.2}
.btn:hover{border-color:var(--ink)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.ghost{background:none}
.icon-btn{width:34px;height:34px;padding:0;justify-content:center}
.switch{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--surface);padding:5px 10px 5px 6px;font-size:13px;font-weight:600;border-radius:3px}
.switch:hover{border-color:var(--ink)}
.lbl-short{display:none}
.switch .track{width:28px;height:16px;border-radius:9px;background:var(--surface2);border:1px solid var(--faint);position:relative;transition:background .15s}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.switch[aria-checked=true]{border-color:var(--bad);background:var(--bad-bg)}
.switch[aria-checked=true] .track{background:var(--bad);border-color:var(--bad)}
.switch[aria-checked=true] .track::after{transform:translateX(12px);background:var(--surface)}
.ribbon{background:repeating-linear-gradient(-45deg,var(--warn-bg) 0 12px,transparent 12px 24px);border-bottom:1px solid var(--warn);color:var(--warn);font:700 11.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;text-align:center;padding:9px 12px}
.ribbon b{background:var(--warn);color:var(--bg);padding:2px 6px;margin-right:8px}

/* ---------- layout ---------- */
.app{transition:padding-right .2s}
main{max-width:1240px;margin:0 auto;padding:26px 20px 80px;outline:none}
h1,h2,h3{font-family:var(--serif);margin:0;font-weight:700;letter-spacing:-.005em}
.eyebrow{font:600 10.5px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.card{background:var(--surface);border:1px solid var(--rule);padding:18px 20px;border-radius:3px}
.card h2{font-size:19px;margin-bottom:4px}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.stack{display:grid;gap:16px;margin-top:16px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.mono{font-family:var(--mono)}
.view-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.view-h h1{font-size:28px}
.counter{font:600 12.5px/1.3 var(--mono);color:var(--muted);letter-spacing:.02em}
.counter b{color:var(--ink)}
.empty{border:1px dashed var(--faint);padding:44px 24px;text-align:center;color:var(--muted);background:var(--surface);border-radius:3px}
.empty h2{color:var(--ink);font-size:24px;margin-bottom:8px}
.empty p{max-width:520px;margin:6px auto}
.drop-on .empty{border-color:var(--sig);background:var(--sig-bg)}

/* ---------- status seal / chips ---------- */
.seal.sm{padding:3px}
.seal{display:inline-flex;align-items:center;gap:5px;font:700 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px 4px 5px;border:1px solid currentColor;border-radius:2px;white-space:nowrap}
.seal.ok{color:var(--ok);background:var(--ok-bg)}
.seal.warn{color:var(--warn);background:var(--warn-bg)}
.seal.bad{color:var(--bad);background:var(--bad-bg)}
.chip{display:inline-block;font:600 11px/1 var(--mono);letter-spacing:.04em;padding:4px 7px;border:1px solid var(--rule);border-radius:2px;color:var(--muted);background:var(--surface2);white-space:nowrap}
.chip.sig{color:var(--sig);background:var(--sig-bg);border-color:transparent}
.chip.ok{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.chip.bad{color:var(--bad);background:var(--bad-bg);border-color:transparent}
.chip.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}

/* ---------- overview ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);border:1px solid var(--ink);background:var(--surface);border-radius:3px}
.hero-main{padding:26px 28px 24px}
.big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;font-family:var(--serif);line-height:.95;margin:2px 0 8px}
.big .n{font-size:clamp(54px,9vw,96px);font-weight:700;letter-spacing:-.03em;color:var(--ok)}
.big .of{font-size:clamp(26px,4vw,44px);color:var(--muted);font-weight:400}
.lede{font-size:17px;margin:0 0 18px;max-width:46ch}
.caveat{padding:26px 28px;border-left:1px solid var(--ink);background:var(--surface2);display:flex;flex-direction:column;justify-content:center;gap:12px}
.caveat .def{font:700 22px/1.25 var(--serif);margin:0}
.caveat .def code{font:700 .78em var(--mono);background:var(--ok-bg);color:var(--ok);padding:2px 6px;border-radius:2px}
.caveat .not{margin:0;font-size:15px;border-left:3px solid var(--bad);padding-left:12px}
.caveat .not b{color:var(--bad)}
.segbar{display:flex;height:16px;border:1px solid var(--ink);background:var(--surface2);overflow:hidden;border-radius:2px}
.segbar>span{display:block;height:100%;min-width:2px}
.segbar>span+span{border-left:1px solid var(--surface)}
.seg-ok{background:var(--ok)}
.seg-bad{background:var(--bad)}
.seg-warn{background:var(--warn)}
.seg-mut{background:var(--faint)}
.seg-sig{background:var(--sig)}
.legend{list-style:none;display:flex;flex-wrap:wrap;gap:6px 18px;margin:12px 0 0;padding:0;font-size:13px;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;display:inline-block;border-radius:1px}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.rate-row{display:grid;grid-template-columns:150px 1fr 64px;gap:12px;align-items:center;margin:10px 0}
.rate-row .lbl{font-size:13px;color:var(--muted);line-height:1.25}
.rate-row .val{font:700 18px/1 var(--serif);text-align:right;font-variant-numeric:tabular-nums}
.track-bar{height:14px;background:var(--surface2);border:1px solid var(--rule);position:relative;border-radius:2px;overflow:hidden}
.track-bar>i{position:absolute;left:0;top:0;bottom:0;display:block}
.model-row{display:grid;grid-template-columns:minmax(90px,170px) 1fr 58px 96px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--rule)}
.model-row:first-of-type{border-top:0}
.model-row .lbl{font:600 13px/1.2 var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.model-row .val{font:700 17px/1 var(--serif);text-align:right;font-variant-numeric:tabular-nums}
.model-row .n{font:12px/1 var(--mono);color:var(--muted);text-align:right}
.axis{display:flex;justify-content:space-between;font:11px/1 var(--mono);color:var(--faint);margin:2px 0 0 182px;padding-right:166px}
.recount{margin:16px 0 0;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:6px}
.kpis.k2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi{background:var(--surface);padding:12px 14px}
.kpi b{display:block;font:700 26px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted)}

/* ---------- findings ---------- */
.fgrid{display:grid;gap:16px}
.fcard{position:relative;background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--ok);border-radius:3px}
.fcard.unv{border-left-color:var(--bad)}
.fhead{padding:18px 20px 16px;display:grid;gap:6px}
.fhead h3{font-size:21px;line-height:1.25;margin:0}
.fbtn{all:unset;cursor:pointer;display:inline;color:var(--ink)}
.fbtn::after{content:"";position:absolute;inset:0}
.fbtn:focus-visible{outline:2px solid var(--sig);outline-offset:4px}
.fcard:hover{border-color:var(--ink);border-left-color:var(--ok)}
.fcard.unv:hover{border-left-color:var(--bad)}
.fhead .thesis{margin:0;max-width:78ch;font-size:15px}
.fcard[data-open=false] .fhead .thesis{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.orig summary{cursor:pointer;color:var(--muted);font-size:13px}
.fmeta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:6px}
.fmeta .chev{margin-left:auto;color:var(--muted);transition:transform .15s}
.fcard[data-open=true] .chev{transform:rotate(90deg)}
.fbody{position:relative;z-index:2;border-top:1px solid var(--rule);padding:6px 20px 20px}
.fbody h4{font:700 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 0 12px}
.timeline{list-style:none;margin:0;padding:0 0 0 22px;border-left:2px solid var(--rule)}
.tl{position:relative;padding:0 0 16px 18px}
.tl::before{content:"";position:absolute;left:-30px;top:4px;width:12px;height:12px;background:var(--surface);border:2px solid var(--ink);border-radius:50%}
.tl.role-origin::before{background:var(--sig);border-color:var(--sig)}
.tl.role-adoption::before,.tl.role-correction::before{background:var(--ok);border-color:var(--ok)}
.tl.role-contradiction::before{background:var(--bad);border-color:var(--bad)}
.tl.role-hedge::before{background:var(--warn);border-color:var(--warn)}
.tl.role-hardening::before{background:var(--bad);border-color:var(--bad);border-radius:1px;transform:rotate(45deg)}
.tl.unverified::before{background:repeating-linear-gradient(45deg,var(--bad) 0 2px,var(--surface) 2px 4px);border-color:var(--bad)}
.ce .timeline{border-left-style:dashed}
.tl-head{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.tl-head b{color:var(--ink);font-size:13.5px}
.tl-head time{font-family:var(--mono);font-size:12px}
.ev{display:block;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--rule);border-left:3px solid var(--ok);padding:9px 12px;font:13px/1.55 var(--mono);color:var(--ink);border-radius:2px;overflow-wrap:anywhere;white-space:pre-wrap}
.ev:hover{border-color:var(--ink);border-left-color:var(--ok)}
.ev.unv{border-left-color:var(--bad);background:repeating-linear-gradient(-45deg,var(--bad-bg) 0 6px,var(--surface2) 6px 12px);color:var(--muted)}
.ev.unv:hover{border-left-color:var(--bad)}
.ev.unv .qtext{text-decoration:line-through;text-decoration-color:var(--bad)}
.ev .go{float:right;margin:2px 0 0 10px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:0;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.lim{margin:0;padding-left:20px;color:var(--muted);font-size:14px}
.lim li{margin:3px 0}
.verdict{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--rule);font-size:14px}
.verdict:first-of-type{border-top:0}
.linkish{background:none;border:0;padding:0;color:var(--sig);text-decoration:underline;font:inherit;cursor:pointer}

/* ---------- claims ---------- */
.toolbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 12px;align-items:end;background:var(--surface);border:1px solid var(--rule);padding:12px 14px;border-radius:3px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font:600 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{border:1px solid var(--rule);background:var(--bg);padding:7px 9px;border-radius:2px;min-width:0;width:100%;height:34px}
.field input:focus,.field select:focus{border-color:var(--sig)}
.field.wide{grid-column:span 2}
.qbar{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.qb{border:1px solid var(--rule);background:var(--surface);padding:5px 9px;font:600 12px/1 var(--mono);border-radius:2px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.qb:hover{border-color:var(--ink);color:var(--ink)}
.qb[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.qb i{font-style:normal;font-weight:500;opacity:.7}
.ctable{border:1px solid var(--rule);background:var(--surface);border-radius:3px}
.chead,.crow-main{display:grid;grid-template-columns:118px 46px minmax(0,1fr) 128px 62px 74px;gap:12px;align-items:center;padding:0 14px}
.chead{background:var(--surface2);border-bottom:1px solid var(--ink);font:700 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chead button{background:none;border:0;padding:11px 0;text-align:left;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;display:flex;gap:4px;align-items:center}
.chead button:hover,.chead button[aria-pressed=true]{color:var(--ink)}
.crow{border-bottom:1px solid var(--rule)}
.crow:last-child{border-bottom:0}
.crow-main{width:100%;text-align:left;background:none;border:0;padding-top:10px;padding-bottom:10px}
.crow-main:hover{background:var(--surface2)}
.crow .ctext{font-size:14px;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.crow[data-open=true] .ctext{display:block;-webkit-line-clamp:unset}
.crow .m{font:12px/1.2 var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cdetail{padding:4px 14px 16px 14px;display:grid;gap:10px;background:var(--surface2);border-top:1px dashed var(--rule)}
.cdetail .ev{background:var(--surface)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.pager .btn[disabled]{opacity:.4;cursor:default}
.lbl-audit{font:700 10px/1 var(--mono);letter-spacing:.1em;color:var(--bad);text-transform:uppercase}

/* ---------- propagation ---------- */
.prop{display:grid;grid-template-columns:minmax(280px,340px) minmax(0,1fr);gap:16px;align-items:start}
.clist-wrap{background:var(--surface);border:1px solid var(--rule);border-radius:3px;max-height:calc(100vh - var(--hh) - 24px);display:flex;flex-direction:column;position:sticky;top:calc(var(--hh) + 12px)}
.clist-h{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--ink);background:var(--surface2)}
.clist-h select{border:1px solid var(--rule);background:var(--bg);padding:4px 6px;border-radius:2px;font-size:12.5px}
.clist{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1}
.citem{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:10px 12px 10px 14px;position:relative}
.citem:hover{background:var(--surface2)}
.citem[aria-current=true]{background:var(--surface2)}
.citem[aria-current=true]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ink)}
.citem .u{font:700 13px/1.25 var(--mono);overflow-wrap:anywhere;display:block;margin-bottom:5px}
.citem .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:12px/1.2 var(--mono);color:var(--muted)}
.citem .row b{color:var(--ink);font-family:var(--serif);font-size:16px}
.mini{display:block;margin-top:7px;width:100%;height:12px}
.cpanel{background:var(--surface);border:1px solid var(--ink);border-radius:3px;padding:18px 20px 12px;min-width:0}
.cpanel h2{font:700 20px/1.25 var(--mono);overflow-wrap:anywhere}
.cstats{display:flex;flex-wrap:wrap;gap:6px 22px;margin:12px 0 4px}
.cstats div{display:flex;flex-direction:column}
.cstats b{font:700 24px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.cstats span{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:2px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:5px 10px;font:600 12px/1 var(--mono)}
.seg button+button{border-left:1px solid var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.chart-wrap{position:relative;margin-top:10px}
.chart text{font:11px var(--mono);fill:var(--muted)}
.chart .lane-l{fill:var(--ink)}
.chart .dot{cursor:pointer}
.chart .dot:focus{outline:none}
.chart .dot:focus .halo,.chart .dot:hover .halo{opacity:1}
.chart .halo{opacity:0;fill:none;stroke:var(--sig);stroke-width:2}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 10px;font:12px/1.4 var(--mono);border-radius:2px;max-width:280px;z-index:5;box-shadow:var(--shadow);overflow-wrap:anywhere}
.tip b{display:block;font-size:13px}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0;border-left:3px solid var(--warn);padding-left:10px}

/* ---------- method ---------- */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;counter-reset:st;border:1px solid var(--ink);background:var(--surface);border-radius:3px}

.step .k{font:700 11px/1 var(--mono);letter-spacing:.12em;color:var(--muted)}
.step h3{font-size:18px;margin:8px 0 6px}
.step p{font-size:13.5px;color:var(--muted);margin:0 0 10px}
.step .who{display:inline-block;font:700 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:4px 6px;border:1px solid currentColor;border-radius:2px}
.who.det{color:var(--ok)}
.who.llm{color:var(--warn)}
.step:not(:last-child)::after{content:"";position:absolute;right:-7px;top:24px;width:12px;height:12px;background:var(--surface);border-top:1px solid var(--ink);border-right:1px solid var(--ink);transform:rotate(45deg);z-index:1}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.is li::marker{color:var(--ok)}
.isnt li::marker{color:var(--bad)}
.card ul{margin:8px 0 0;padding-left:20px}
.card li{margin:5px 0}
.stt{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
.stt td{padding:7px 8px;border-top:1px solid var(--rule);vertical-align:top}
.stt td:first-child{white-space:nowrap}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:var(--drawer);background:var(--surface);border-left:1px solid var(--ink);box-shadow:var(--shadow);z-index:40;display:flex;flex-direction:column;transform:translateX(102%);transition:transform .22s cubic-bezier(.2,.8,.2,1),visibility 0s linear .22s;visibility:hidden}
body.has-drawer .drawer{transform:none;visibility:visible;transition:transform .22s cubic-bezier(.2,.8,.2,1),visibility 0s}
.drawer-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--ink);background:var(--surface2)}
.drawer-h h2{font:700 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase}
.drawer-b{overflow-y:auto;padding:16px 18px 28px;display:grid;gap:16px;align-content:start;flex:1}
.verdict-box{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid currentColor;border-radius:3px}
.verdict-box.ok{color:var(--ok);background:var(--ok-bg)}
.verdict-box.bad{color:var(--bad);background:var(--bad-bg)}
.verdict-box.warn{color:var(--warn);background:var(--warn-bg)}
.verdict-box p{margin:0;color:var(--ink);font-size:13.5px}
.verdict-box b{display:block;font:700 12px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.drawer h3{font:700 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-family:var(--mono)}
.qblock{margin:0;padding:10px 12px;border-left:3px solid var(--ok);background:var(--surface2);font:13px/1.55 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
.qblock.unv{border-left-color:var(--bad)}
.ctx{position:relative;max-height:min(46vh,420px);overflow:auto;padding:12px 14px;border:1px solid var(--rule);background:var(--bg);font:13px/1.65 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}

.idrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.idrow code{font:12px/1.4 var(--mono);overflow-wrap:anywhere;background:var(--surface2);padding:3px 6px;border-radius:2px}
.fine{font-size:12.5px;color:var(--muted);margin:0}
.drawer-nav{display:flex;gap:8px;align-items:center;justify-content:space-between}
.demo-tag{font:700 10px/1 var(--mono);letter-spacing:.12em;color:var(--warn);border:1px solid var(--warn);padding:3px 5px;border-radius:2px}

/* ---------- responsive ---------- */
@media(min-width:1100px){body.has-drawer .app{padding-right:min(520px,38vw)}body.has-drawer{--hh:96px}body.has-drawer .tabs{order:3;flex-basis:100%;margin-left:0}}

@media(max-width:1200px){:root{--hh:96px}.tabs{order:3;flex-basis:100%;margin-left:0}}
@media(max-width:900px){
  .hero{grid-template-columns:1fr}
  .caveat{border-left:0;border-top:1px solid var(--ink)}

  .clist-wrap{position:static;max-height:300px}
  .steps{grid-template-columns:1fr 1fr}
  .step:nth-child(3){border-left:0}
  .step:nth-child(n+3){border-top:1px solid var(--rule)}

}
@media(max-width:760px){
  .chead{display:none}

  .crow-main>.c-st{grid-area:st}.crow-main>.c-q{grid-area:q}.crow-main>.m{grid-area:m;text-align:right}
  .crow-main>.ctext{grid-area:tx}.crow-main>.c-ev{grid-area:ev;text-align:left}.crow-main>.c-cf{grid-area:cf;text-align:right}

}

  .top-in{padding:10px 12px 0;gap:6px 10px}

  .tools{gap:6px}
  .lbl-long,.lbl-ld{display:none}.lbl-short{display:inline}

  .hero-main,.caveat{padding:18px 16px}

  .drawer-b{padding:14px}
}
@keyframes reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes grow{from{transform:scaleX(0)}}
.hero .segbar,.card .segbar{animation:reveal .9s cubic-bezier(.2,.8,.2,1) both}
.track-bar>i{transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) .1s both}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}

<body>
<div class="app" id="app">
  <header class="top">
    <div class="top-in">
      <div class="brand" id="brand"></div>
      <div class="tabs" role="tablist" aria-label="Views" id="tabs"></div>
      <div class="tools" id="tools"></div>
    </div>
  </header>
  <div class="ribbon" id="ribbon" hidden><b>DEMO</b>synthetic data generated in your browser &mdash; not evidence</div>
  <main id="main" tabindex="-1"><noscript><p class="empty">This viewer needs JavaScript. It runs entirely offline and sends no data anywhere.</p></noscript></main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="false" aria-labelledby="drawer-title" aria-hidden="true">
  <div class="drawer-h"><h2 id="drawer-title">Evidence</h2><button class="btn icon-btn ghost" id="drawer-close" aria-label="Close evidence panel (Esc)" title="Close (Esc)"></button></div>
  <div class="drawer-b" id="drawer-body"></div>
</aside>
<div class="sr-only" id="live" aria-live="polite" role="status"></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script id="report-data" type="application/json">null</script>
<script>
(function(){

/* ================= helpers (DOM is only ever built with createElement/textContent) ================= */

const str=x=>x==null?'':typeof x==='string'?x:typeof x==='object'?JSON.stringify(x):String(x);

}
function announce(msg){const l=$('#live');l.textContent='';setTimeout(()=>{l.textContent=msg;},30);}

/* ================= status vocabulary ================= */
const ST={
  verified:{label:'Verified',cls:'ok',ic:'check',hint:'The quote occurs verbatim in the cited event (case, whitespace and quote style ignored).'},
  partial:{label:'Partial',cls:'warn',ic:'warn',hint:'Some quotes of this claim verify, some do not.'},
  rejected:{label:'Rejected',cls:'bad',ic:'x',hint:'None of the claim’s quotes verify.'},
  no_evidence:{label:'No evidence',cls:'bad',ic:'x',hint:'The claim cites nothing, so it cannot be checked.'},
  count_mismatch:{label:'Count mismatch',cls:'bad',ic:'x',hint:'A counted claim (2–12) must cite exactly one event per counted instance.'},
  quote_not_found:{label:'Quote not found',cls:'bad',ic:'x',hint:'The cited event exists but the quote does not occur in it.'},
  quote_too_short:{label:'Quote too short',cls:'bad',ic:'x',hint:'Under 8 characters after normalisation: matches almost anything, proves nothing.'},
  quote_too_long:{label:'Quote too long',cls:'bad',ic:'x',hint:'Over 60 words: a whole message proves nothing specific.'},

const QNAMES={Q1:'Coordination',Q2:'Leadership',Q3:'Propagation',Q4:'Conflict',Q5:'Misreport',Q6:'Deception',Q7:'Humans',Q8:'Failure modes',Q9:'Goal fidelity',Q10:'Norms',Q11:'Belief hardening'};

/* ================= state ================= */
const DEMO=/[?&]demo=1(&|$)/.test(location.search);
const S={report:null,demo:false,audit:false,view:'overview',params:new URLSearchParams(),claims:[],findings:[],cascades:[],refMs:Date.now(),
  cl:{q:'',status:'',model:'',actor:'',text:'',sort:'',dir:1,page:1,open:new Set()},

/* ================= normalise (defensive: every field may be missing) ================= */

/* ================= chrome, theme, router ================= */
function applyTheme(t){const r=document.documentElement;if(t==='light'||t==='dark')r.setAttribute('data-theme',t);else r.removeAttribute('data-theme');}

function hashFor(view){

    for(let i=0;i<m;i++)lags.push(Math.exp(mu+1.6*(rnd()+rnd()+rnd()-1.5)));

    const t0=T0+int(20,150)*3600e3,mkhop=(actor,lag,origin)=>{const line=origin?'Introducing '+unit+' for the whole board, please try it.':pick(['Using '+unit+' here now.','I adopted '+unit+' in my pipeline.','Reusing '+unit+' as suggested.','Ported the checklist to '+unit+'.']);
      const i=line.indexOf(unit),ms=t0+lag*3600e3;
      return {event_id:newId(),ts:iso(ms),actor,raw:unit,lag_hours:Math.round(lag*100)/100,status:'verified',deeplink:'https://theaidigest.org/village',context:line,span:[i,i+unit.length]};};
    const adopters=lags.map((l,i)=>mkhop('Agent-'+String(ci*40+i+1).padStart(3,'0'),l,false));
    if(ci===2)adopters[5]={...adopters[5],status:'quote_not_found',context:null,span:null};
    if(ci===6)adopters[11]={...adopters[11],status:'quote_not_found',context:null,span:null};
    const med=lags[Math.floor(lags.length/2)];
    return {unit,kind,origin:mkhop(pick(ACT),0,true),adopters,uses_total:Math.round(n*(1.2+rnd()*2)),uses_in_horizon:n,burst:Math.round((.55+rnd()*.45)*1000)/1000,median_lag_hours:Math.round(med*100)/100,n_adopters:n};
  });
  /* metrics computed from the generated rows, so the viewer's recount agrees */
  const qst={};let quotes=0;for(const c of claims)for(const e of c.evidence){quotes++;qst[e.status]=(qst[e.status]||0)+1;}
  const cst={};for(const c of claims)cst[c.status]=(cst[c.status]||0)+1;
  const byModel={};let fq=0,fv=0;
  for(const [name,rate] of MODELS){const q=int(240,520),v=Math.round(q*(1-rate));byModel[name]={quotes:q,verified:v,reject_rate:Math.round((1-v/q)*10000)/10000};fq+=q;fv+=v;}
  const hops=cascades.reduce((s,c)=>s+1+c.adopters.length,0),hb=cascades.reduce((s,c)=>s+c.adopters.filter(x=>x.status!=='verified').length,0);
  return {meta:{title:'DEMO – Lantern sprint (synthetic)',source:'demo',generated:'2026-09-29T15:00:00+00:00'},
    metrics:{final:{quotes,quote_status:qst,quote_reject_rate:Math.round((1-(qst.verified||0)/quotes)*10000)/10000,claims:claims.length,claim_status:cst,claims_flagged:claims.filter(c=>Object.keys(c.flags).length).length},
      first_pass:{quotes:fq,quote_status:{verified:fv,quote_not_found:fq-fv},quote_reject_rate:Math.round((1-fv/fq)*10000)/10000,claims:Math.round(fq/2.1)},first_pass_by_model:byModel,tracer:{hops,hops_rejected:hb}},
    findings,claims,cascades};
}

/* ================= boot ================= */
function setReport(raw,isDemo){
  let n;try{n=normalize(raw);}catch(e){showEmpty('The file could not be interpreted: '+e.message);return;}
  S.report=n;S.raw=raw;S.demo=!!isDemo;S.claims=n.claims;S.findings=n.findings;S.cascades=n.cascades;
  const g=parseTs(n.meta.generated);S.refMs=g==null?Date.now():g;
  $('#ribbon').hidden=!S.demo;
  document.title=(str(n.meta.title)||'Report')+' – SwarmScope Evidence Viewer';
  S.cl={q:'',status:'',model:'',actor:'',text:'',sort:'',dir:1,page:1,open:new Set()};S.fi={open:new Set()};S.pr.sel=0;
  buildChrome();route();
}
function showEmpty(msg){S.report=null;buildChrome();renderEmpty(msg);}
function renderEmpty(msg){
  const main=$('#main');main.replaceChildren(
    h('div',{class:'empty'},h('p',{class:'eyebrow'},'No report loaded'),h('h2',null,'Load a report.json to inspect its evidence'),
      h('p',null,msg||'Drop a report.json anywhere on this page, or choose a file. Everything is processed locally in your browser; nothing is uploaded.'),
      h('p',null,h('button',{class:'btn',onclick:()=>$('#file').click()},ic('up',15),'Load report.json')),
      h('p',{class:'fine'},'Reports embedded at build time (viewer/embed.py) open automatically. Append ?demo=1 to preview with synthetic data.')));
}
async function loadFile(f){
  try{const t=await f.text();setReport(JSON.parse(t),false);announce('Report loaded: '+f.name);}
  catch(e){renderEmpty('Could not read '+(f&&f.name)+': '+e.message);}
}
async function boot(){
  $('#drawer-close').append(ic('x',16));
  buildChrome();
  let data=null,demo=false;
  try{const t=$('#report-data').textContent.trim();if(t&&t!=='null')data=JSON.parse(t);}catch(e){renderEmpty('The embedded report is not valid JSON: '+e.message);return;}
  if(!data&&DEMO){data=makeDemo();demo=true;}
  if(!data&&/^https?:$/.test(location.protocol)){ // fetch is blocked for file:// pages: only try it over http(s), instead of logging a CORS error
    try{const r=await fetch('report.json',{cache:'no-store'});if(r.ok)data=await r.json();}catch(e){}
  }
  window.addEventListener('hashchange',route);
  if(data)setReport(data,demo);else renderEmpty();
}
document.addEventListener('DOMContentLoaded',boot);
})();
</script>
