[project]
name = "swarmscope"
version = "0.1.0"
description = "Evidence-grounded forensics for multi-agent (swarm) transcripts"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pytz>=2026.4",
]

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
swarmscope = "swarmscope.cli:main"

[tool.pytest.ini_options]
# wikiswarm/ has its own tests (run them from wikiswarm/); never collect the quarantined scripts
testpaths = ["tests"]
